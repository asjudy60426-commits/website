<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>你的內在呼吸地圖</title>
  <style>
    :root {
      --aman-sand: #f3eee7;
      --aman-brown: #2b2418;
      --terra: #b85c40;
      --terra-dk: #9c4a30;
      --gold: #b8913e;
      --gold-lt: #c9a55a;
      --sand: #d4c4a4;
      --jungle-green: #314f39;
      --leaf-green: #6f8a4f;
      --deep-blue: #27556a;
      --bird-blue: #7fa7b8;
      --ink: var(--aman-brown);
      --muted: #7a6f60;
      --paper: var(--aman-sand);
      --panel: #f8f4ed;
      --line: #d9cbb5;
      --cta: var(--terra);
      --cta-hover: var(--terra-dk);
      --radius: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, textarea, select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
    }

    .scene {
      position: relative;
      overflow: hidden;
      padding: 42px;
      color: var(--aman-sand);
      background: var(--aman-brown);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
    }

    .brand {
      position: relative;
      z-index: 1;
    }

    .kicker {
      margin: 0 0 14px;
      color: var(--gold-lt);
      font-size: 12px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 5vw, 68px);
      line-height: 1.04;
      font-weight: 400;
      letter-spacing: .08em;
    }

    .scene-copy {
      position: relative;
      z-index: 1;
      margin-top: 34px;
      max-width: 28rem;
      color: #e1d6c4;
      line-height: 1.9;
    }

    .scene-status {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      margin-top: 40px;
    }

    .breath-mark {
      width: 74px;
      height: 74px;
      border: 1px solid var(--gold);
      border-radius: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    .breath-mark::before,
    .breath-mark::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(201, 165, 90, .68);
      border-radius: 0;
      inset: 12px;
      animation: breathe 5s ease-in-out infinite;
    }

    .breath-mark::after {
      inset: 26px;
      border-color: var(--terra);
      animation-delay: .6s;
    }

    .breath-dot {
      width: 8px;
      height: 8px;
      border-radius: 0;
      background: var(--aman-sand);
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.82); opacity: .54; }
      50% { transform: scale(1.14); opacity: 1; }
    }

    .content {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 38px;
    }

    .panel {
      width: min(760px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .progress-wrap {
      height: 7px;
      background: #e4d8c7;
    }

    .progress {
      width: 0;
      height: 100%;
      background: var(--terra);
      transition: width .8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .screen {
      padding: clamp(24px, 5vw, 48px);
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .section-label {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0;
      font-size: clamp(27px, 4vw, 42px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .prompt {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.85;
    }

    .field-note {
      margin: 10px 0 0;
      color: var(--terra-dk);
      font-size: 14px;
      line-height: 1.7;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .option {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--aman-sand);
      color: var(--ink);
      display: block;
      padding: 0;
      text-align: left;
      cursor: pointer;
      transition: border-color .32s ease, background .32s ease, color .32s ease;
      overflow: hidden;
    }

    .option:hover,
    .option:focus {
      border-color: var(--terra);
      background: #efe4d5;
      outline: none;
    }

    .option.selected {
      border-color: var(--terra);
      background: #ead9c7;
    }

    .option-visual {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-bottom: 1px solid var(--line);
      display: block;
      background: #f8f4ed;
    }

    .option-visual svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scene-bg { fill: #fbf6ee; }
    .scene-paper { fill: #f3eee7; opacity: .55; }
    .scene-ground { fill: #d4c4a4; opacity: .28; }
    .scene-shadow { fill: #c9a55a; opacity: .18; }
    .scene-fill { fill: #d4c4a4; opacity: .42; }
    .scene-terra { fill: #b85c40; opacity: .28; }
    .scene-gold { fill: #b8913e; opacity: .32; }
    .wash-sand { fill: #d4c4a4; opacity: .24; }
    .wash-terra { fill: #b85c40; opacity: .18; }
    .wash-gold { fill: #b8913e; opacity: .22; }
    .wash-brown { fill: #2b2418; opacity: .08; }
    .wash-clear { fill: none; stroke: #d4c4a4; stroke-width: 10; stroke-linecap: round; opacity: .22; }
    .wash-warm { fill: none; stroke: #b85c40; stroke-width: 12; stroke-linecap: round; opacity: .16; }
    .wash-light { fill: none; stroke: #b8913e; stroke-width: 12; stroke-linecap: round; opacity: .2; }
    .jungle-leaf { fill: #314f39; opacity: .84; stroke: #2b2418; stroke-width: .55; }
    .jungle-light { fill: #6f8a4f; opacity: .78; stroke: #2b2418; stroke-width: .45; }
    .jungle-blue { fill: #27556a; opacity: .82; }
    .jungle-bird { fill: #7fa7b8; opacity: .86; stroke: #2b2418; stroke-width: .65; }
    .jungle-animal { fill: #c4ad8b; opacity: .9; stroke: #2b2418; stroke-width: .7; }
    .jungle-red { fill: #b85c40; opacity: .88; }
    .paper-crack { fill: none; stroke: #d9cbb5; stroke-width: .55; opacity: .32; }

    .option-visual .stroke {
      fill: none;
      stroke: var(--aman-brown);
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .82;
    }

    .option-visual .accent {
      fill: none;
      stroke: var(--terra);
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .78;
    }

    .option-visual .gold {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .82;
    }

    .option-label {
      display: block;
      padding: 14px 16px 16px;
      font-size: 15px;
      line-height: 1.65;
    }

    .scale {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .scale button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--aman-sand);
      color: var(--ink);
      cursor: pointer;
      padding: 0;
      display: block;
      text-align: left;
      transition: background .32s ease, border-color .32s ease;
      overflow: hidden;
    }

    .scale span {
      display: block;
      font-size: 15px;
      line-height: 1.55;
    }

    .scale button:hover,
    .scale button:focus,
    .scale button.selected {
      border-color: var(--terra);
      background: #ead9c7;
      outline: none;
    }

    .text-field,
    .select-field {
      width: 100%;
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--aman-sand);
      color: var(--ink);
      padding: 14px 15px;
      outline: none;
    }

    textarea.text-field {
      min-height: 150px;
      resize: vertical;
      line-height: 1.7;
    }

    .grid-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 26px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--aman-brown);
      font-size: 14px;
      font-weight: 700;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 34px;
    }

    .btn {
      min-height: 46px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 11px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: background .32s ease, border-color .32s ease;
    }

    .btn:hover,
    .btn:focus {
      outline: none;
    }

    .btn-primary {
      background: var(--cta);
      color: var(--aman-sand);
    }

    .btn-primary:hover,
    .btn-primary:focus {
      background: var(--cta-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--aman-brown);
      border-color: var(--line);
    }

    .btn[disabled] {
      cursor: not-allowed;
      opacity: .45;
      transform: none;
    }

    .counter {
      color: var(--muted);
      font-size: 14px;
    }

    .report {
      display: grid;
      gap: 18px;
      margin-top: 28px;
    }

    .report-section {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      background: var(--aman-sand);
    }

    .report-section h3 {
      margin: 0 0 10px;
      color: var(--aman-brown);
      font-size: 18px;
    }

    .report-section p,
    .report-section li {
      color: var(--muted);
      line-height: 1.75;
    }

    .report-section ul {
      margin: 0;
      padding-left: 1.2rem;
    }

    .score-bars {
      display: grid;
      gap: 10px;
    }

    .score-row {
      display: grid;
      grid-template-columns: 7.5rem 1fr 2rem;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .bar {
      height: 9px;
      border-radius: 0;
      background: #e4d8c7;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--terra);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      padding: 12px 16px;
      border-radius: 0;
      background: var(--aman-brown);
      color: var(--aman-sand);
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .app {
        display: block;
      }

      .scene {
        min-height: auto;
        padding: 28px;
      }

      .scene-copy,
      .scene-status {
        display: none;
      }

      .content {
        min-height: auto;
        padding: 22px;
      }
    }

    @media (max-width: 620px) {
      .screen {
        min-height: 610px;
        padding: 24px;
      }

      .option,
      .scale button {
        min-height: 0;
      }

      .options,
      .scale {
        grid-template-columns: 1fr;
      }

      .grid-fields {
        grid-template-columns: 1fr;
      }

      .actions {
        align-items: stretch;
        flex-direction: column-reverse;
      }

      .btn {
        width: 100%;
      }

      .counter {
        text-align: center;
      }

      .score-row {
        grid-template-columns: 1fr;
        gap: 6px;
      }
    }

    @media print {
      body {
        background: var(--aman-sand);
      }

      .scene,
      .progress-wrap,
      .actions,
      .toast {
        display: none !important;
      }

      .app,
      .content,
      .panel,
      .screen {
        display: block;
        min-height: 0;
        padding: 0;
        box-shadow: none;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="scene" aria-label="呼吸旅程場景">
      <div class="brand">
        <p class="kicker">一對一重生呼吸前導測驗</p>
        <h1>你的內在<br>呼吸地圖</h1>
        <p class="scene-copy">每一道題都是一盞小燈，照見你現在的身體、情緒、關係與方向。答案沒有好壞，只有此刻的真實。</p>
      </div>

      <div class="scene-status">
        <div class="breath-mark"><span class="breath-dot"></span></div>
        <p class="kicker">目前章節會隨你的作答推進，像走進一座安靜的森林。</p>
      </div>
    </aside>

    <section class="content">
      <div class="panel">
        <div class="progress-wrap"><div class="progress" id="progress"></div></div>
        <div class="screen" id="screen"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已複製摘要</div>

  <script>
    const archetypes = {
      A: {
        name: "撐住世界的守門人",
        element: "土",
        gift: "可靠、能承擔、在混亂中維持秩序",
        invitation: "練習把肩膀放下，讓身體知道：現在不必只靠意志撐住。",
        report: "你很習慣把事情扛起來，也可能在關係或工作裡先照顧別人的需要。呼吸旅程可以從安全感、界線和放鬆開始，慢慢讓控制鬆動。"
      },
      B: {
        name: "深海裡的感受者",
        element: "水",
        gift: "敏銳、共感、能碰觸很深的情緒層次",
        invitation: "允許感受有出口，不急著分析，也不急著變好。",
        report: "你內在可能有許多尚未被說出口的感覺。呼吸旅程可以支持情緒流動，讓你在被接住的節奏裡釋放累積。"
      },
      C: {
        name: "迷霧中的尋路者",
        element: "風",
        gift: "願意思考、願意探索、對生命方向保持誠實",
        invitation: "先不用逼自己立刻有答案，讓身體帶你靠近真正的方向。",
        report: "你可能正站在人生階段的轉折處，對工作、關係或自我價值有新的提問。呼吸旅程可以協助你從身體感受中整理方向。"
      },
      D: {
        name: "準備重啟的火種",
        element: "火",
        gift: "有行動力、渴望突破、願意讓生命更新",
        invitation: "讓改變不只是用力推進，而是從內在力量自然長出來。",
        report: "你已經感覺到某種改變正在靠近，舊模式可能開始變得太小。呼吸旅程可以支持你釋放阻力，重新連回生命感與行動力。"
      }
    };

    const questions = [
      {
        id: "gate",
        type: "single",
        section: "第一章：森林入口",
        title: "你來到一座安靜的森林，入口有四條小徑。你會先走向哪一條？",
        prompt: "這一題像是替你目前的內在狀態選一張地圖。",
        options: [
          ["A", "一條穩穩的石階路，我想先確認自己是安全的。"],
          ["B", "一條通往湖邊的路，我想找地方讓情緒慢慢流出來。"],
          ["C", "一條有霧的小路，我想知道自己到底在尋找什麼。"],
          ["D", "一條有微光的山路，我想走向改變，即使還有點怕。"]
        ]
      },
      {
        id: "weather",
        type: "single",
        section: "第一章：森林入口",
        title: "如果你的最近是一種天氣，它最像什麼？",
        prompt: "不用想太久，選最像這段時間的身心氣候。",
        options: [
          ["A", "表面晴朗，但土地有點乾裂，像是撐很久了。"],
          ["B", "大雨前的濕重空氣，很多感覺快要落下來。"],
          ["C", "晨霧，走得到下一步，但遠方還看不清楚。"],
          ["D", "遠方有雷聲，知道有什麼快要被打開。"]
        ]
      },
      {
        id: "themes",
        type: "single",
        section: "第二章：幾扇門",
        title: "眼前有幾扇門，你會選擇哪一扇門？",
        prompt: "單選。先選此刻最想推開的一扇門，其他門之後仍然可以在諮詢中慢慢看見。",
        options: [
          ["career", "事業／職涯規劃的門"],
          ["intimacy", "親密關係的門"],
          ["money", "金錢與安全感的門"],
          ["family", "家庭關係的門"],
          ["people", "人際關係的門"],
          ["growth", "個人成長／靈性覺醒的門"],
          ["body", "身體與健康狀態的門"],
          ["emotion", "情緒壓力與內在穩定的門"]
        ]
      },
      {
        id: "stress",
        type: "scale",
        section: "第三章：身體的訊號",
        title: "一陣風經過，空氣忽然變重。你通常怎麼處理心裡累積的東西？",
        metric: "情緒累積",
        options: [
          [1, "我會先停一下，讓它散掉，再回到生活。"],
          [2, "我會找地方喘口氣，但很快又繼續往前。"],
          [3, "我把它收進身體裡，直到某個小事讓它溢出來。"],
          [4, "我感覺有一場雨在裡面等很久，快要落下。"]
        ]
      },
      {
        id: "body_tension",
        type: "scale",
        section: "第三章：身體的訊號",
        title: "你走到一面安靜的牆前，身體先替你回答。它比較像哪一種狀態？",
        metric: "身體緊繃",
        options: [
          [1, "身體還算柔軟，呼吸可以自然進出。"],
          [2, "肩頸或胸口偶爾收緊，提醒我該慢下來。"],
          [3, "身體像長時間握拳，呼吸常停在比較淺的地方。"],
          [4, "整個人像被一層硬殼包住，很難真正鬆開。"]
        ]
      },
      {
        id: "relax",
        type: "scale",
        section: "第三章：身體的訊號",
        title: "眼前有一張椅子，邀請你坐下。你比較可能發生什麼事？",
        metric: "放鬆困難",
        options: [
          [1, "我能坐下來，讓身體慢慢回到安靜。"],
          [2, "我會坐一下，但腦中還有幾件事在轉。"],
          [3, "我人在休息，裡面卻像還開著很多視窗。"],
          [4, "我一停下來反而更不安，好像不該什麼都不做。"]
        ]
      },
      {
        id: "tired",
        type: "scale",
        section: "第三章：身體的訊號",
        title: "你撿起一塊沒有名字的石頭。那種累，比較像什麼？",
        metric: "無名疲憊",
        options: [
          [1, "累有明確來源，休息後通常會回來。"],
          [2, "有些累，但我大致知道它從哪裡來。"],
          [3, "累像霧一樣散在身體裡，說不上是哪裡。"],
          [4, "我像背著一塊看不見的重量，很久沒有放下。"]
        ]
      },
      {
        id: "work",
        type: "scale",
        section: "第四章：路標",
        title: "路標指向工作與生活。你看見自己的腳步，比較像哪一幕？",
        metric: "生活消耗",
        options: [
          [1, "我知道自己為什麼走，也還有力氣。"],
          [2, "方向大致清楚，只是最近步伐有點重。"],

    function setProgress() {
      const total = questions.length + 2;
      const current = state.step < 0 ? 0 : Math.min(state.step + 1, total);

      }

      if (q.type === "multi") {
        const values = Array.isArray(answered) ? answered : [];
        body = `<div class="options">${q.options.map((opt, index) => `
          <button class="option ${values.includes(opt[0]) ? "selected" : ""}" type="button" onclick="toggleMulti('${q.id}', '${escapeAttribute(opt[0])}')">

            <span class="option-label">${opt[1]}</span>

      }

      if (q.type === "text") {
        body = `<textarea class="text-field" id="textAnswer" placeholder="${escapeAttribute(q.placeholder || "")}">${escapeHtml(answered || "")}</textarea>`;

      screen.innerHTML = `

        ${q.prompt ? `<p class="prompt">${q.prompt}</p>` : ""}

          <button class="btn btn-secondary" type="button" onclick="prevStep()">上一題</button>
          <span class="counter">${state.step + 1} / ${questions.length}</span>

        </div>
      `;

      if (q.type === "text") {
        const input = document.getElementById("textAnswer");
        input.addEventListener("input", () => {
          state.answers[q.id] = input.value.trim();
          const next = screen.querySelector(".btn-primary");
          next.disabled = !canContinue(q);

        input.focus();

      setProgress();
      const result = calculateResult();
      const type = archetypes[result.top];

      screen.innerHTML = `

    function nextStep() {
      if (state.step < questions.length - 1) {
        state.step += 1;
        renderQuestion();
        return;
      }
      state.step = questions.length;
      renderBasic();
    }

    function prevStep() {
      if (state.step === questions.length) {
        state.step = questions.length - 1;
        renderQuestion();
        return;
      }
      if (state.step > 0) {
        state.step -= 1;
        renderQuestion();
        return;
      }
      renderStart();
    }

    function answerSingle(id, value) {
      state.answers[id] = value;
      setTimeout(() => nextStep(), 160);
    }

    function answerScale(id, value) {
      state.answers[id] = value;
      setTimeout(() => nextStep(), 160);
    }

    function toggleMulti(id, value) {
      const current = Array.isArray(state.answers[id]) ? state.answers[id] : [];
      state.answers[id] = current.includes(value)
        ? current.filter(item => item !== value)
        : current.concat(value);
      renderQuestion();
    }

    function canContinue(q) {
      const answer = state.answers[q.id];
      if (q.type === "text") return typeof answer === "string" && answer.length > 0;
      if (q.type === "multi") return Array.isArray(answer) && answer.length > 0;
      return answer !== undefined && answer !== null && answer !== "";
    }

    function optionVisual(q, opt, index) {
      const name = visualName(q, opt, index);
      return `<span class="option-visual" aria-hidden="true">${visualSvg(name, index)}</span>`;
    }

    function visualName(q, opt, index) {
      const byQuestion = {
        gate: ["stonePath", "waterPath", "mistPath", "lightPath"],
        weather: ["drySun", "rainCloud", "mist", "thunder"],
        themes: ["doorWork", "doorHeart", "doorGold", "doorHome", "doorPeople", "doorSpark", "doorBody", "doorCloud"],
        stress: ["openAir", "breath", "vessel", "rainCloud"],
        body_tension: ["softBody", "shoulder", "fist", "shell"],
        relax: ["chair", "window", "manyWindows", "alert"],
        tired: ["smallStone", "twoStones", "fogStone", "heavyStone"],
        work: ["signClear", "signSlow", "crossroad", "pushedRoad"],
        effort: ["footprint", "bowl", "hollow", "offering"],
        relationship: ["bridgeOpen", "bridgeSoft", "bridgeWatch", "bridgeClosed"],
        boundary: ["clearLine", "softLine", "thinLine", "brokenLine"],
        direction: ["pathLight", "pathTurn", "crossroad", "blockedPath"],
        inner_power: ["ember", "seed", "risingFire", "flame"],
        stress_response: ["closedDoor", "wave", "questionPath", "sparkAction"],
        need: ["exhale", "release", "map", "flame"],
        voice: ["pillar", "message", "crossroad", "brokenShell"],
        difficulty: ["rest", "waterDrop", "choice", "step"],
        breath_exp: ["spiral", "firstDoor"],
        schedule: ["sun", "midday", "afternoon", "moon", "weekendSun", "weekendMidday", "weekendAfternoon", "weekendMoon"]
      };
      return (byQuestion[q.id] && byQuestion[q.id][index]) || ["door", "wave", "path", "flame"][index % 4];
    }

    function visualSvg(name, index) {
      const label = index + 1;
      const svgs = {

          <path class="wash-warm" d="M67 82c27-37 78-49 118-18"/>`;

        return `<path class="wash-sand" d="M8 31c43-18 81 9 124 0 37-8 68-17 101 0v64H8z"/>

      if (["chair", "window", "manyWindows", "rest"].includes(name)) {

        return `<path class="wash-sand" d="M20 35c38-18 75-15 112-1 36 14 62 9 91-3v72H20z"/>
          <path class="wash-light" d="M34 86c52-18 113-18 173 0"/>`;

      if (["signClear", "signSlow", "crossroad", "pushedRoad", "pathTurn", "pathLight", "blockedPath", "choice", "step"].includes(name)) {
        return `<path class="wash-gold" d="M25 23c41-17 77-10 113 6 33 14 61 9 84-5v69H25z"/>
          <path class="wash-clear" d="M50 91c31-26 79-39 137-38"/>`;

    function sceneContextLines(name) {

    function motifTransform(name) {
      const large = ["rainCloud", "mist", "thunder", "chair", "window", "manyWindows", "alert", "fist", "shell", "heavyStone", "crossroad", "bridgeClosed", "flame", "risingFire", "map"];
      const wide = ["wave", "exhale", "release", "bridgeOpen", "bridgeSoft", "bridgeWatch", "rest"];
      if (wide.includes(name)) return "translate(48 37) scale(2.2)";
      if (large.includes(name)) return "translate(62 28) scale(2.0)";
      return "translate(66 33) scale(1.85)";

          <text x="206" y="28" fill="#b8913e" font-size="18" font-family="Georgia, 'Times New Roman', serif">${label}</text>
        </svg>`,
        waterPath: `<svg viewBox="0 0 240 135" role="img" aria-label="選項${label}湖邊情境圖">
          <rect class="scene-bg" x="0" y="0" width="240" height="135"/>
          <path class="scene-paper" d="M0 0h240v135H0z"/>
          ${paperTexture()}
          <path class="wash-sand" d="M24 18c42-11 74 9 105 4 34-5 57-17 90-4v48H24z"/>
          ${jungleFrame("waterPath")}
          <path class="scene-ground" d="M0 84h240v51H0z"/>
          <path class="stroke" d="M0 84h240"/>
          <path class="wash-terra" d="M13 91c35-19 59 13 91 1 30-11 62-8 121 6v37H13z"/>
          <path class="accent" d="M20 96c24-18 48 18 72 0s48 18 72 0 38-9 56 1"/>
          <path class="gold" d="M24 112c22-12 44 12 66 0s42 12 64 0"/>
          <path class="stroke" d="M67 77c12-17 24-26 42-35M108 82c13-20 29-31 52-45"/>
          <circle class="scene-gold" cx="183" cy="32" r="11"/>
          <text x="206" y="28" fill="#b8913e" font-size="18" font-family="Georgia, 'Times New Roman', serif">${label}</text>
        </svg>`,
        mistPath: `<svg viewBox="0 0 240 135" role="img" aria-label="選項${label}霧中小路情境圖">
          <rect class="scene-bg" x="0" y="0" width="240" height="135"/>
          <path class="scene-paper" d="M0 0h240v135H0z"/>
          ${paperTexture()}
          <path class="wash-sand" d="M18 25c48-16 70 12 113 4 32-6 56-18 94-4v49H18z"/>
          ${jungleFrame("mistPath")}
          <path class="scene-ground" d="M0 86h240v49H0z"/>
          <path class="stroke" d="M0 86h240"/>
          <path class="scene-shadow" d="M98 135l10-49h23l13 49z"/>
          <path class="stroke" d="M108 86L98 135M131 86l13 49"/>
          <path class="gold" d="M28 41c28-4 58-4 92 0M54 57c38-5 80-4 124 0M19 74c22-4 46-4 72 0M132 74c22-4 46-4 73 0"/>
          <path class="accent" d="M174 35c10-2 20-2 31 0"/>
          <text x="206" y="28" fill="#b8913e" font-size="18" font-family="Georgia, 'Times New Roman', serif">${label}</text>
        </svg>`,
        lightPath: `<svg viewBox="0 0 240 135" role="img" aria-label="選項${label}光路情境圖">
          <rect class="scene-bg" x="0" y="0" width="240" height="135"/>
          <path class="scene-paper" d="M0 0h240v135H0z"/>
          ${paperTexture()}
          <path class="wash-gold" d="M131 8c28-9 60 0 84 20v52c-35-11-69-14-106-8z"/>
          ${jungleFrame("lightPath")}
          <path class="scene-ground" d="M0 85h240v50H0z"/>
          <path class="stroke" d="M0 85h240"/>
          <path class="scene-shadow" d="M71 135c36-29 62-51 103-93l18 18c-29 31-55 56-75 75z"/>
          <path class="stroke" d="M71 135c36-29 62-51 103-93M117 135c20-19 46-44 75-75"/>
          <path class="scene-gold" d="M176 24h20v20h-20z"/>
          <path class="accent" d="M186 14c-1 13-1 27 0 40M166 34c13-2 26-2 40 0"/>
          <text x="206" y="28" fill="#b8913e" font-size="18" font-family="Georgia, 'Times New Roman', serif">${label}</text>
        </svg>`
      };

      if (name.startsWith("door")) {
        return `<svg viewBox="0 0 240 135" role="img" aria-label="選項${label}門的情境圖">
          <rect class="scene-bg" x="0" y="0" width="240" height="135"/>
          <path class="scene-paper" d="M0 0h240v135H0z"/>
          ${paperTexture()}
          <path class="wash-gold" d="M37 14c39-13 73 8 110 3 27-4 49-9 70 1v42H37z"/>
          ${jungleFrame(name)}
          <path class="scene-ground" d="M0 92h240v43H0z"/>
          <path class="stroke" d="M0 92h240"/>
          <path class="wash-sand" d="M58 104c34-11 77-12 120-2 18 4 34 4 54-2v35H58z"/>
          <rect class="scene-fill" x="88" y="28" width="64" height="64"/>
          <rect class="stroke" x="88" y="28" width="64" height="64"/>
          <path class="stroke" d="M108 92V52h24v40"/>
          <path class="accent" d="M137 67h5"/>
          <g transform="translate(90 34) scale(.9)">${doorSymbol(name)}</g>
          <path class="gold" d="M60 102c38-5 78-5 120 0M76 114c27-3 56-3 88 0"/>
          <text x="206" y="28" fill="#b8913e" font-size="18" font-family="Georgia, 'Times New Roman', serif">${label}</text>
        </svg>`;
      }

      return scenes[name] || "";
    }

    function doorSymbol(name) {
      const symbols = {
        doorWork: `<path class="accent" d="M38 28h24M38 38h16"/>`,
        doorHeart: `<path class="accent" d="M50 49c-15-9-15-22-4-22 4 0 5 2 5 5 1-3 4-5 8-5 10 1 8 14-9 22z"/>`,
        doorGold: `<circle class="gold" cx="51" cy="39" r="12"/><path class="accent" d="M51 27v24M39 39h24"/>`,
        doorHome: `<path class="accent" d="M28 36l24-17 24 17"/><path class="gold" d="M45 62V45h13v17"/>`,
        doorPeople: `<circle class="gold" cx="43" cy="38" r="6"/><circle class="accent" cx="59" cy="38" r="6"/><path class="stroke" d="M33 56c4-8 16-8 20 0M50 56c4-8 16-8 20 0"/>`,
        doorSpark: `<path class="gold" d="M52 21v40M32 41h40"/><path class="accent" d="M39 28l26 26M65 28L39 54"/>`,
        doorBody: `<path class="accent" d="M52 25c9 10 9 24 0 36-9-12-9-26 0-36z"/><path class="gold" d="M39 42h26"/>`,
        doorCloud: `<path class="accent" d="M36 48c3-12 17-12 23-4 7-5 16 0 15 8H32"/>`
      };
      return symbols[name] || "";
    }

    function finishQuiz() {
      state.basic = {
        name: document.getElementById("name").value.trim(),
        age: document.getElementById("age").value,
        location: document.getElementById("location").value,
        phone: document.getElementById("phone").value.trim(),
        line: document.getElementById("line").value.trim(),
        email: document.getElementById("email").value.trim(),
        note: document.getElementById("note").value.trim()
      };
      state.step = questions.length + 1;
      renderResult();
    }

    function renderBasicFromResult() {
      state.step = questions.length;
      renderBasic();
    }

    function calculateResult() {
      const scores = { A: 0, B: 0, C: 0, D: 0 };
      const singleIds = ["gate", "weather", "stress_response", "need", "voice", "difficulty"];
      singleIds.forEach(id => {
        const value = state.answers[id];
        if (scores[value] !== undefined) scores[value] += 2;
      });

      const scaleMap = {
        stress: "B",
        body_tension: "A",
        relax: "A",
        tired: "C",
        work: "C",
        effort: "A",
        relationship: "B",
        boundary: "B",
        direction: "C",
        inner_power: "D"
      };
      Object.keys(scaleMap).forEach(id => {
        const value = Number(state.answers[id] || 0);
        if (value >= 3) scores[scaleMap[id]] += value - 1;
      });

      const themeMap = {
        career: "C",
        intimacy: "B",
        money: "A",
        family: "B",
        people: "B",
        growth: "D",
        body: "A",
        emotion: "B"
      };
      const theme = state.answers.themes;
      if (themeMap[theme]) scores[themeMap[theme]] += 2;

      const top = Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
      const maxScore = Math.max(...Object.values(scores), 1);
      return { scores, top, maxScore };
    }

    function getHighMetrics() {
      return questions
        .filter(q => q.type === "scale" && Number(state.answers[q.id] || 0) >= 3)
        .map(q => `${q.metric} ${state.answers[q.id]}/4`);
    }

    function getAnswerLabels(id) {
      const q = questions.find(item => item.id === id);
      const answer = state.answers[id];
      if (!q || answer === undefined || answer === null || answer === "") return [];
      const values = Array.isArray(answer) ? answer : [answer];
      return values.map(value => {
        const found = q.options.find(opt => opt[0] === value);
        return found ? found[1] : value;
      });
    }

    function answerText(id) {
      const q = questions.find(item => item.id === id);
      const value = state.answers[id];
      if (!q || value === undefined) return "";
      if (q.type === "single") {
        const found = q.options.find(opt => opt[0] === value);
        return found ? found[1] : value;
      }
      if (Array.isArray(value)) return getAnswerLabels(id).join("、");
      return value;
    }

    function buildSummary(result, type, highMetrics, themes, schedule) {
      const b = state.basic;
      return [
        "一對一重生呼吸前導測驗摘要",
        "",
        `姓名：${b.name || ""}`,
        `年齡區間：${b.age || ""}`,
        `現居地：${b.location || ""}`,
        `電話：${b.phone || ""}`,
        `Line ID：${b.line || ""}`,
        `Email：${b.email || ""}`,
        "",
        `主要原型：${type.name}`,
        `原型分數：守門人 ${result.scores.A}／感受者 ${result.scores.B}／尋路者 ${result.scores.C}／火種 ${result.scores.D}`,
        `最想被支持的主題：${themes.join("、") || "尚未填寫"}`,
        `較高身心訊號：${highMetrics.join("、") || "無特別高分項目"}`,
        `重生呼吸經驗：${answerText("breath_exp") || "尚未填寫"}`,
        `其他身心練習：${state.answers.practices || "尚未填寫"}`,
        "",
        `目前最卡住：${state.answers.stuck || "尚未填寫"}`,
        `最想改變：${state.answers.change || "尚未填寫"}`,
        `期待支持：${state.answers.expectation || "尚未填寫"}`,
        `希望被尊重／避開：${state.answers.respect || "尚未填寫"}`,
        `安全確認：${state.answers.safety || "尚未填寫"}`,
        `強烈情緒時希望如何被支持：${state.answers.support || "尚未填寫"}`,
        `可預約時段：${schedule.join("、") || "尚未填寫"}`,
        `其他補充：${b.note || "無"}`
      ].join("\n");
    }

    async function copySummary() {
      try {
        await navigator.clipboard.writeText(state.summary || "");
        showToast("已複製摘要");
      } catch (error) {
        showToast("無法自動複製，可用列印保存");
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function escapeAttribute(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    renderStart();
  </script>
</body>
